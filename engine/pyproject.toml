[project]
name = "zotero-local-translate-engine"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
# Keep engine-facing APIs compatible with this tested engine release.
dependencies = [
    "pdf2zh-next==2.9.0", "babeldoc==0.6.2",
    "bitstring==4.4.0", "openai==2.38.0", "pydantic==2.11.10",
    "onnxruntime==1.23.2; sys_platform == 'darwin'",
    "opencv-python-headless==4.12.0.88; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography==48.0.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
